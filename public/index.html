<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>AI相場リサーチ</title>

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="相場リサーチ" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />

<!-- PWA -->
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />

<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior-y: none; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: var(--text);
    min-height: 100vh;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bottom) + 80px); /* sticky bar用 */
    -webkit-font-smoothing: antialiased;
    font-size: 16px; /* iOS自動ズーム防止 */
  }
  .container { max-width: 720px; margin: 0 auto; padding: 16px; }

  /* ヘッダー */
  .app-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 16px;
  }
  .app-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .app-title { flex: 1; }
  .app-title h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }
  .app-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .icon-btn {
    width: 40px; height: 40px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
  }

  /* パネル */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .panel-title {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* フォーム */
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  input[type="text"], input[type="password"], input[type="number"], select, textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px; /* iOSの自動ズーム防止 */
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 36px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .field-stack > * + * { margin-top: 12px; }

  /* ボタン */
  button {
    padding: 14px 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    min-height: 48px; /* タッチターゲット */
    transition: transform 0.1s, opacity 0.2s;
    font-family: inherit;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.5; }
  button.secondary {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-row { display: flex; gap: 8px; }
  .btn-row > * { flex: 1; }

  /* 画像アップロード */
  .upload-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .upload-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    color: var(--text);
    transition: background 0.2s;
  }
  .upload-btn:active { background: var(--border); }
  .upload-btn .icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .upload-btn .lbl { font-size: 13px; font-weight: 600; }
  #cameraInput, #galleryInput { display: none; }

  .thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 6px;
    margin-top: 12px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .remove {
    position: absolute;
    top: 4px; right: 4px;
    width: 26px; height: 26px;
    background: rgba(0,0,0,0.75);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    color: white;
    line-height: 1;
  }

  /* マーケット選択 */
  .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .market-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    user-select: none;
  }
  .market-chip.checked {
    background: rgba(56,189,248,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .market-chip input { display: none; }
  .market-chip .dot { font-size: 14px; }

  /* AI結果 */
  .ai-result {
    background: rgba(56,189,248,0.06);
    border: 1px solid rgba(56,189,248,0.3);
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
  }
  .ai-result .lbl { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .ai-result .val { color: var(--accent); font-weight: 700; font-size: 15px; word-break: break-word; }

  /* ステータス */
  .status {
    padding: 12px;
    border-radius: 10px;
    background: var(--panel-2);
    border-left: 3px solid var(--accent);
    font-size: 13px;
    color: var(--muted);
    display: none;
    margin-top: 12px;
  }
  .status.show { display: block; }
  .status.error { border-left-color: var(--danger); color: var(--danger); background: rgba(248,113,113,0.08); }
  .status.success { border-left-color: var(--success); color: var(--success); background: rgba(52,211,153,0.08); }

  /* サマリ */
  .summary-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .summary-grid-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .summary-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    padding: 6px 4px;
  }
  .stat-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    user-select: none;
  }
  .stat-card[data-clickable="true"]:active { transform: scale(0.97); }
  .stat-card[data-clickable="true"]:hover { background: var(--border); }
  .stat-card.highlight {
    background: linear-gradient(135deg, rgba(56,189,248,0.1), rgba(129,140,248,0.1));
    border-color: var(--accent);
  }
  .stat-card[data-clickable="false"] { cursor: default; opacity: 0.95; }
  .stat-card .lbl { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .stat-card .val { font-size: 20px; font-weight: 800; color: var(--accent); line-height: 1.2; }
  .stat-card .sub { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .stat-card .tap-hint { font-size: 9px; color: var(--accent); margin-top: 4px; opacity: 0.7; }

  /* 価格帯分布 */
  .bars { margin-top: 14px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 11px; }
  .bar-label { width: 80px; color: var(--muted); flex-shrink: 0; }
  .bar-track { flex: 1; height: 18px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.4s; }
  .bar-value { width: 50px; text-align: right; color: var(--accent); font-weight: 700; flex-shrink: 0; }

  /* 結果リスト（カード形式） */
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .tab.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
  }
  .result-list { display: flex; flex-direction: column; gap: 8px; }
  .result-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .result-card a { color: inherit; text-decoration: none; display: flex; gap: 10px; width: 100%; }
  .result-image {
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    border-radius: 8px;
    background: #0f172a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result-image img { width: 100%; height: 100%; object-fit: cover; }
  .result-image .placeholder { color: var(--muted); font-size: 24px; }
  .result-body { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .result-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .result-title { font-size: 13px; line-height: 1.4; flex: 1; word-break: break-word; }
  .result-price { font-size: 16px; font-weight: 800; color: var(--success); white-space: nowrap; }
  .result-meta { display: flex; gap: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    color: white;
  }
  .badge-yahoo, .badge-yahoo_auction { background: #ef4444; }
  .badge-paypay { background: #f97316; }
  .badge-mercari { background: #dc2626; }
  .badge-rakuma { background: #db2777; }
  .badge-rakuten { background: #bf0000; }
  .badge-yahoo_shopping { background: #ff0033; }
  .badge-ebay { background: #2563eb; }
  .badge-tiktok { background: #1e293b; border: 1px solid #ec4899; }
  .badge-sold { background: #10b981; color: white; }
  .badge-listing { background: #6366f1; color: white; }

  /* スティッキー実行ボタン */
  .sticky-action {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(15,23,42,0.9) 30%, var(--bg) 100%);
    padding: 16px 16px calc(16px + var(--safe-bottom));
    z-index: 100;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .sticky-action .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  .sticky-action button { flex: 1; position: relative; overflow: hidden; }
  /* リップル効果（タップ視覚化） */
  button.busy {
    background: linear-gradient(135deg, #475569, #334155);
    color: #cbd5e1;
    cursor: wait;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  /* プログレス表示 */
  .progress-panel {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    display: none;
  }
  .progress-panel.show { display: block; }
  .progress-title {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-bar {
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .progress-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--panel-2);
    border-radius: 8px;
    font-size: 12px;
  }
  .progress-item.pending { color: var(--muted); }
  .progress-item.searching { color: var(--accent); }
  .progress-item.done { color: var(--success); }
  .progress-item.error { color: var(--danger); }
  .progress-item .icon { font-size: 14px; min-width: 14px; }
  .progress-item .name { flex: 1; }
  .progress-item .count { font-weight: 700; }
  .mini-spinner {
    display: inline-block;
    width: 10px;
    height: 10px;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* 設定モーダル */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 200;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--panel);
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(20px + var(--safe-bottom));
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-header h2 { margin: 0; font-size: 16px; }
  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 24px;
    width: 30px;
    height: 30px;
    padding: 0;
    cursor: pointer;
  }
  .info-box {
    background: rgba(56,189,248,0.06);
    border-left: 3px solid var(--accent);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }
  .hidden { display: none !important; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (min-width: 600px) {
    .summary-grid-inner { grid-template-columns: repeat(4, 1fr); }
    .market-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <!-- ヘッダー -->
  <div class="app-header">
    <div class="app-icon">🔍</div>
    <div class="app-title">
      <h1>AI相場リサーチ</h1>
      <p>画像から複数マーケットの実取引価格を一括検索</p>
    </div>
    <button type="button" class="icon-btn" id="btnSettings" title="設定" style="background:var(--panel);border:1px solid var(--border);">⚙️</button>
  </div>

  <!-- 画像アップロード -->
  <div class="panel">
    <h2 class="panel-title">📷 商品の写真</h2>
    <div class="upload-buttons">
      <label for="cameraInput" class="upload-btn">
        <span class="icon">📸</span>
        <span class="lbl">カメラで撮影</span>
      </label>
      <label for="galleryInput" class="upload-btn">
        <span class="icon">🖼️</span>
        <span class="lbl">写真ライブラリ</span>
      </label>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" />
    <input type="file" id="galleryInput" accept="image/*" multiple />
    <div class="thumbs" id="thumbs"></div>
  </div>

  <!-- 検索条件 -->
  <div class="panel">
    <h2 class="panel-title">🏷️ 検索条件</h2>
    <div class="field-stack">
      <div>
        <label>商品の状態</label>
        <select id="condition">
          <option value="any">指定なし</option>
          <option value="new">新品・未使用</option>
          <option value="like_new">未使用に近い</option>
          <option value="good">目立った傷や汚れなし</option>
          <option value="fair">やや傷や汚れあり</option>
          <option value="poor">傷や汚れあり</option>
          <option value="junk">ジャンク・全体的に状態が悪い</option>
        </select>
      </div>
      <div>
        <label>除外キーワード（半角スペース区切り）</label>
        <input type="text" id="excludeKw" placeholder="例: ジャンク 部品取り" />
      </div>
    </div>
    <label style="margin-top:14px">対象マーケット<span style="color:var(--muted);font-weight:400;font-size:11px;margin-left:6px">（💰=実取引 / 🏷️=現行販売）</span></label>
    <div class="market-grid" id="marketChecks">
      <label class="market-chip checked"><input type="checkbox" value="yahoo_auction" checked /><span class="dot">💰</span>ヤフオク!</label>
      <label class="market-chip checked"><input type="checkbox" value="paypay" checked /><span class="dot">💰</span>Yahoo!フリマ</label>
      <label class="market-chip checked"><input type="checkbox" value="mercari" checked /><span class="dot">💰</span>メルカリ</label>
      <label class="market-chip checked"><input type="checkbox" value="rakuma" checked /><span class="dot">💰</span>ラクマ</label>
      <label class="market-chip checked"><input type="checkbox" value="rakuten" checked /><span class="dot">🏷️</span>楽天市場</label>
      <label class="market-chip checked"><input type="checkbox" value="yahoo_shopping" checked /><span class="dot">🏷️</span>Yahoo!ショッピング</label>
      <label class="market-chip checked"><input type="checkbox" value="ebay" checked /><span class="dot">💰</span>eBay</label>
      <label class="market-chip checked"><input type="checkbox" value="tiktok" checked /><span class="dot">🏷️</span>TikTok Shop</label>
    </div>
  </div>

  <!-- AI識別結果 -->
  <div class="panel" id="aiPanel">
    <h2 class="panel-title">🤖 AI識別結果</h2>
    <div id="aiResultBox" class="hidden">
      <div class="ai-result">
        <div class="lbl">識別された検索キーワード</div>
        <div class="val" id="aiResultText"></div>
      </div>
      <label style="margin-top:12px">キーワードを編集</label>
      <input type="text" id="finalKeyword" placeholder="検索キーワード" />
    </div>
    <div id="aiHint" style="color:var(--muted);font-size:13px;">
      写真をアップロードしてから下の「AIで識別」ボタンを押してください。
    </div>
  </div>

  <!-- ステータス -->
  <div id="status" class="status"></div>

  <!-- 検索進捗パネル -->
  <div class="progress-panel" id="progressPanel">
    <div class="progress-title">
      <span class="mini-spinner"></span>
      <span id="progressTitleText">マーケット検索中...</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-list" id="progressList"></div>
  </div>

  <!-- 価格サマリ -->
  <div class="panel hidden" id="summaryPanel">
    <h2 class="panel-title">📊 価格サマリ</h2>
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="bars" id="distBars"></div>
  </div>

  <!-- 結果一覧 -->
  <div class="panel hidden" id="resultsPanel">

<script>
// ====== グローバル状態 ======
const state = {
  images: [],
  aiKeyword: '',
  aiCategory: '',  // ジャンル（fashion, car, coin等）
  results: [],
};

// ====== DOM ======
const $ = (id) => document.getElementById(id);
const thumbs = $('thumbs');
const statusEl = $('status');

// ====== サーバーURL: 同一オリジン優先 ======
function getServerUrl() {
  const saved = (localStorage.getItem('rs_proxyUrl') || '').trim();
  if (saved) return saved.replace(/\/$/, '');
  // 同一オリジン (PWAデプロイ時)
  return window.location.origin;
}

// ====== localStorage 永続化 ======
['aiProvider', 'apiKey', 'proxyUrl'].forEach(k => {
  const el = $(k);
  const saved = localStorage.getItem('rs_' + k);
  if (saved) el.value = saved;
});

// ====== 設定モーダル ======
$('btnSettings').onclick = () => $('settingsModal').classList.add('show');
$('btnCloseSettings').onclick = () => $('settingsModal').classList.remove('show');
$('btnSaveSettings').onclick = () => {
  ['aiProvider', 'apiKey', 'proxyUrl'].forEach(k => {
    localStorage.setItem('rs_' + k, $(k).value);
  });
  $('settingsModal').classList.remove('show');
  setStatus('設定を保存しました', 'success');
  setTimeout(clearStatus, 2000);
};
$('settingsModal').addEventListener('click', (e) => {
  if (e.target.id === 'settingsModal') $('settingsModal').classList.remove('show');
});

// ====== マーケットチップ ======
document.querySelectorAll('.market-chip').forEach(chip => {
  const input = chip.querySelector('input');
  chip.addEventListener('click', (e) => {
    if (e.target !== input) {
      e.preventDefault();
      input.checked = !input.checked;
    }
    chip.classList.toggle('checked', input.checked);
  });
});

// ====== 画像アップロード ======
$('cameraInput').addEventListener('change', (e) => handleFiles(e.target.files));
$('galleryInput').addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(files) {
  for (const f of files) {
    if (state.images.length >= 10) break;
    if (!f.type.startsWith('image/')) continue;
    const reader = new FileReader();
    reader.onload = (e) => {
      state.images.push({ file: f, dataUrl: e.target.result });
      renderThumbs();
    };
    reader.readAsDataURL(f);
  }
  // input をリセット (同じファイルを再アップロード可能に)
  $('cameraInput').value = '';
  $('galleryInput').value = '';
}

function renderThumbs() {
  thumbs.innerHTML = '';
  state.images.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${img.dataUrl}"><div class="remove" data-i="${i}">×</div>`;
    thumbs.appendChild(div);
  });
  thumbs.querySelectorAll('.remove').forEach(el => {
    el.onclick = (e) => {
      state.images.splice(parseInt(e.target.dataset.i), 1);
      renderThumbs();
    };
  });
}

// ====== ステータス ======
function setStatus(msg, type = 'info') {
  statusEl.className = 'status show' + (type !== 'info' ? ' ' + type : '');
  statusEl.innerHTML = msg;
  statusEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function clearStatus() { statusEl.className = 'status'; }

// ====== 全カテゴリ対応 AI プロンプト ======
const UNIVERSAL_AI_PROMPT = `あなたは日本の買取査定・相場リサーチの専門家です。画像の商品を詳細に観察し、ジャンルを自動判定して、その商品種別に最適な検索キーワードを生成してください。

1. **色は必ずカタカナ（グリーン、ブラウン、ブラック、ホワイト等）。漢字色（緑、茶、黒、白、赤、青）は絶対禁止**

// ====== AI Vision呼び出し ======
async function analyzeImagesWithAI() {
  const provider = localStorage.getItem('rs_aiProvider') || $('aiProvider').value;
  const apiKey = localStorage.getItem('rs_apiKey') || $('apiKey').value.trim();

  if (provider === 'manual') {
    $('aiResultBox').classList.remove('hidden');
    $('aiHint').classList.add('hidden');
    $('finalKeyword').focus();
    setStatus('手入力モードです。キーワードを入力してください。');
    return;
  }
  if (!apiKey) {
    setStatus('⚙️設定からAPIキーを入力してください', 'error');
    $('settingsModal').classList.add('show');
    return;
  }
  if (state.images.length === 0) {
    setStatus('写真をアップロードしてください', 'error');
    return;
  }

  const btnAnalyze = $('btnAnalyze');
  const btnSearch = $('btnSearch');
  const origText = btnAnalyze.innerHTML;
  btnAnalyze.disabled = true;
  btnSearch.disabled = true;
  btnAnalyze.classList.add('busy');
  btnAnalyze.innerHTML = '<span class="spinner"></span>AI解析中...';

  setStatus('<span class="spinner"></span>AIが画像を解析中... (10〜20秒)');
  try {
    let aiRes = { keyword: '', category: '' };
    if (provider === 'claude') aiRes = await analyzeWithClaude(apiKey);
    else if (provider === 'openai') aiRes = await analyzeWithOpenAI(apiKey);

    state.aiKeyword = aiRes.keyword;
    state.aiCategory = aiRes.category;
    const catLabel = categoryLabel(aiRes.category);
    $('aiResultText').innerHTML = (catLabel ? `<span style="background:rgba(56,189,248,0.2);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:11px;margin-right:6px">${escapeHtml(catLabel)}</span>` : '') + escapeHtml(aiRes.keyword);
    $('finalKeyword').value = aiRes.keyword;
    $('aiResultBox').classList.remove('hidden');
    $('aiHint').classList.add('hidden');
    setStatus(`AI識別完了！${catLabel ? `ジャンル: ${catLabel} / ` : ''}キーワードを編集してから「🔎 検索実行」を押してください`, 'success');
  } catch (err) {
    console.error(err);
    setStatus('AI解析エラー: ' + err.message, 'error');
  } finally {
    btnAnalyze.disabled = false;
    btnSearch.disabled = false;
    btnAnalyze.classList.remove('busy');
    btnAnalyze.innerHTML = origText;
  }
}

async function analyzeWithClaude(apiKey) {
  const content = [
    { type: 'text', text: UNIVERSAL_AI_PROMPT }
  ];
  for (const img of state.images) {
    const base64 = img.dataUrl.split(',')[1];
    const mediaType = img.file.type;
    content.push({
      type: 'image',
      source: { type: 'base64', media_type: mediaType, data: base64 }
    });
  }

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{ role: 'user', content }]
    })
  });
  if (!res.ok) throw new Error('Claude API: ' + (await res.text()));
  const data = await res.json();
  return extractAiResult(data.content[0].text);
}

// AIの出力から CATEGORY: と KEYWORD: 行を抽出
function extractAiResult(text) {
  const result = { category: '', keyword: '' };
  if (!text) return result;
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  for (let i = lines.length - 1; i >= 0; i--) {
    if (!result.keyword) {
      const km = lines[i].match(/^KEYWORD\s*[:：]\s*(.+)$/i);
      if (km) result.keyword = km[1].trim();
    }
    if (!result.category) {
      const cm = lines[i].match(/^CATEGORY\s*[:：]\s*([a-z_]+)/i);
      if (cm) result.category = cm[1].trim().toLowerCase();
    }
    if (result.keyword && result.category) break;
  }
  if (!result.keyword) result.keyword = lines[lines.length - 1] || text.trim();
  return result;
}

// 旧 extractKeyword 互換（外部から呼ばれる可能性）
function extractKeyword(text) {
  return extractAiResult(text).keyword;
}

async function analyzeWithOpenAI(apiKey) {
  const content = [
    { type: 'text', text: UNIVERSAL_AI_PROMPT }
  ];
  for (const img of state.images) {
    content.push({ type: 'image_url', image_url: { url: img.dataUrl } });
  }
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({
      model: 'gpt-4o',
      max_tokens: 1000,
      messages: [{ role: 'user', content }]
    })
  });
  if (!res.ok) throw new Error('OpenAI API: ' + (await res.text()));
  const data = await res.json();
  return extractAiResult(data.choices[0].message.content);
}

// カテゴリIDを表示用ラベルに変換
function categoryLabel(cat) {
  return {
    fashion: 'ファッション', watch: '時計', jewelry: 'ジュエリー',
    electronics: '家電', camera: 'カメラ', car: '車', bike: 'バイク',
    coin: '古銭・貨幣', stamp: '切手・テレカ', antique: 'アンティーク・骨董',
    toy: 'おもちゃ・フィギュア', game: 'ゲーム', card: 'トレカ',
    book: '書籍', media: 'CD/DVD', instrument: '楽器', sports: 'スポーツ',
    tool: '工具', cosmetic: 'コスメ', food_drink: '食品・酒',
    furniture: '家具', art: 'アート', pen_writing: '筆記具',
    lighter: 'ライター', military: 'ミリタリー', precious_metal: '貴金属',
    doll: '人形', bicycle_parts: '自転車', kimono: '着物', other: 'その他'
  }[cat] || '';
}

// 検索の二重実行防止フラグ
let _isSearching = false;

// ====== 検索実行 ======
async function searchAllMarkets() {
  if (_isSearching) {
    console.warn('[search] already running - ignored');
    return;
  }
  const keyword = ($('finalKeyword').value || '').trim();
  if (!keyword) {
    setStatus('まず「AIで識別」を実行するか、キーワードを入力してください', 'error');
    return;
  }
  const markets = Array.from(document.querySelectorAll('#marketChecks input:checked')).map(c => c.value);
  if (markets.length === 0) { setStatus('対象マーケットを1つ以上選択してください', 'error'); return; }
  _isSearching = true;

  const exclude = $('excludeKw').value.trim();
  const condition = $('condition').value;
  const serverUrl = getServerUrl();

  // ボタンを「検索中」状態にする
  const btnSearch = $('btnSearch');
  const btnAnalyze = $('btnAnalyze');
  const origSearchText = btnSearch.innerHTML;
  btnSearch.disabled = true;
  btnAnalyze.disabled = true;
  btnSearch.classList.add('busy');
  btnSearch.innerHTML = '<span class="spinner"></span>検索中...';

  state.results = [];
  $('summaryPanel').classList.add('hidden');
  $('resultsPanel').classList.add('hidden');
  clearStatus();

  // 進捗パネルを初期化
  initProgress(markets, keyword);

  // 並列で検索しつつ、終わったマーケットから順に進捗UI更新
  let completed = 0;
  let total = 0;
  const perMarket = {};
  const errors = [];

  const promises = markets.map(async (market) => {
    setProgressItem(market, 'searching');
    try {
      const res = await fetch(`${serverUrl}/api/search?market=${market}&q=${encodeURIComponent(keyword)}&exclude=${encodeURIComponent(exclude)}&condition=${condition}&category=${encodeURIComponent(state.aiCategory || '')}`);
      const data = res.ok ? await res.json() : { error: res.statusText, items: [] };
      const items = data.items || [];
      perMarket[market] = { count: items.length, error: data.error };
      for (const item of items) {
        state.results.push({ ...item, market });
        total++;
      }
      if (data.error) {
        errors.push(`${marketLabel(market)}: ${data.error}`);
        setProgressItem(market, 'error', 0, data.error);
      } else {
        setProgressItem(market, 'done', items.length);
      }
    } catch (err) {
      perMarket[market] = { count: 0, error: err.message };
      errors.push(`${marketLabel(market)}: ${err.message}`);
      setProgressItem(market, 'error', 0, err.message);
    } finally {
      completed++;
      updateProgressBar(completed, markets.length, total);
    }
  });

  await Promise.all(promises);

  // ボタンを元に戻す
  btnSearch.disabled = false;
  btnAnalyze.disabled = false;
  btnSearch.classList.remove('busy');
  btnSearch.innerHTML = origSearchText;

  // 検索終了マーク
  _isSearching = false;

  if (total === 0) {
    const errMsg = errors.length ? '<br>エラー: ' + errors.join(' / ') : '';
    setStatus(`取引データが見つかりませんでした。キーワードを短く・一般的に変えて再試行してください。${errMsg}`, 'error');
    return;
  }
  setStatus(`✅ ${total} 件取得 (${markets.length}マーケット中 ${Object.values(perMarket).filter(v=>v.count>0).length} マーケットからデータ)`, 'success');

  try {
    renderSummary();
    renderResults(perMarket);
    // 結果が見えるようにスクロール
    setTimeout(() => {
      $('summaryPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  } catch (e) {
    console.error('renderError', e);
    setStatus('結果表示エラー: ' + e.message, 'error');
  }
}

// 進捗パネル初期化
function initProgress(markets, keyword) {
  $('progressPanel').classList.add('show');
  $('progressTitleText').textContent = `"${keyword}" を ${markets.length} マーケットで検索中...`;
  $('progressFill').style.width = '0%';
  const list = $('progressList');
  list.innerHTML = '';
  for (const m of markets) {
    const item = document.createElement('div');
    item.className = 'progress-item pending';
    item.id = `prog-${m}`;
    item.innerHTML = `<span class="icon">⏳</span><span class="name">${marketLabel(m)}</span><span class="count"></span>`;
    list.appendChild(item);
  }
}

// 個別マーケット状態更新
function setProgressItem(market, state, count = 0, errMsg = '') {
  const item = $(`prog-${market}`);
  if (!item) return;
  item.className = 'progress-item ' + state;
  const icon = item.querySelector('.icon');
  const countEl = item.querySelector('.count');
  if (state === 'searching') {
    icon.innerHTML = '<span class="mini-spinner"></span>';
    countEl.textContent = '検索中...';
  } else if (state === 'done') {
    icon.textContent = '✅';
    countEl.textContent = count > 0 ? `${count} 件` : '0 件';
  } else if (state === 'error') {
    icon.textContent = '❌';
    countEl.textContent = 'エラー';
    item.title = errMsg;
  }
}

// 進捗バー更新
function updateProgressBar(completed, total, foundCount) {
  const pct = (completed / total) * 100;
  $('progressFill').style.width = pct + '%';
  $('progressTitleText').textContent = `${completed} / ${total} マーケット完了 (合計 ${foundCount} 件取得)`;
}

// ====== サマリ表示 ======
function renderSummary() {
  const valid = state.results.filter(r => typeof r.price === 'number' && r.price > 0);
  if (valid.length === 0) return;

  // 実取引(sold=true) と 現行販売(sold=false) に分割
  const soldItems = valid.filter(r => r.sold === true);
  const listingItems = valid.filter(r => r.sold !== true);

  const fmt = (n) => '¥' + n.toLocaleString();

  const cardHtml = (lblText, valStr, subStr, item, highlight) => {
    const has = item && item.url;
    return `<div class="stat-card ${highlight ? 'highlight' : ''}" data-clickable="${has ? 'true' : 'false'}" data-url="${has ? escapeHtml(item.url) : ''}">
      <div class="lbl">${lblText}</div>
      <div class="val">${valStr}</div>
      <div class="sub">${subStr}</div>
      ${has ? '<div class="tap-hint">▶ タップで詳細</div>' : ''}
    </div>`;
  };

  const computeStats = (items) => {
    if (items.length === 0) return null;
    const sortedItems = [...items].sort((a, b) => a.price - b.price);
    const prices = sortedItems.map(r => r.price);
    const sum = prices.reduce((a, b) => a + b, 0);
    const avg = Math.round(sum / prices.length);
    const minItem = sortedItems[0];
    const maxItem = sortedItems[sortedItems.length - 1];
    const medianItem = sortedItems[Math.floor(sortedItems.length / 2)];
    let avgItem = sortedItems[0]; let avgDiff = Math.abs(sortedItems[0].price - avg);
    for (const it of sortedItems) {
      const d = Math.abs(it.price - avg);
      if (d < avgDiff) { avgDiff = d; avgItem = it; }
    }
    const variance = prices.reduce((acc, v) => acc + Math.pow(v - avg, 2), 0) / prices.length;
    const std = Math.round(Math.sqrt(variance));
    return { sortedItems, prices, avg, minItem, maxItem, medianItem, avgItem, std };
  };

  const soldStats = computeStats(soldItems);
  const listingStats = computeStats(listingItems);

  let html = '';

  if (soldStats) {
    html += `<div class="summary-section-title">💰 実取引価格（実際に売れた金額・${soldStats.prices.length}件）</div>`;
    html += `<div class="summary-grid-inner">
      ${cardHtml('平均価格', fmt(soldStats.avg), `±${soldStats.std.toLocaleString()}`, soldStats.avgItem, true)}
      ${cardHtml('中央値', fmt(soldStats.medianItem.price), '外れ値に強い', soldStats.medianItem, true)}
      ${cardHtml('最高落札', fmt(soldStats.maxItem.price), `${soldStats.prices.length}件中`, soldStats.maxItem, false)}
      ${cardHtml('最低落札', fmt(soldStats.minItem.price), `${soldStats.prices.length}件中`, soldStats.minItem, false)}
    </div>`;
  }

  if (listingStats) {
    html += `<div class="summary-section-title" style="margin-top:14px">🏷️ 現行販売価格（今買える価格・${listingStats.prices.length}件）</div>`;
    html += `<div class="summary-grid-inner">
      ${cardHtml('平均価格', fmt(listingStats.avg), `±${listingStats.std.toLocaleString()}`, listingStats.avgItem, true)}
      ${cardHtml('中央値', fmt(listingStats.medianItem.price), '外れ値に強い', listingStats.medianItem, true)}
      ${cardHtml('最高販売', fmt(listingStats.maxItem.price), `${listingStats.prices.length}件中`, listingStats.maxItem, false)}
      ${cardHtml('最低販売', fmt(listingStats.minItem.price), `${listingStats.prices.length}件中`, listingStats.minItem, false)}
    </div>`;
  }

  $('summaryGrid').innerHTML = html;

  // クリックイベント（タップで該当商品へジャンプ）
  $('summaryGrid').querySelectorAll('.stat-card[data-clickable="true"]').forEach(card => {
    card.addEventListener('click', () => {
      const url = card.dataset.url;
      if (url) window.open(url, '_blank', 'noopener');
    });
  });

  // 全アイテムの価格帯分布
  const allSorted = [...valid].sort((a, b) => a.price - b.price);
  const allPrices = allSorted.map(r => r.price);
  const distMin = allPrices[0];
  const distMax = allPrices[allPrices.length - 1];
  const buckets = 6;
  const range = distMax - distMin || 1;
  const step = range / buckets;
  const counts = new Array(buckets).fill(0);
  for (const p of allPrices) {
    let idx = Math.floor((p - distMin) / step);
    if (idx >= buckets) idx = buckets - 1;
    counts[idx]++;
  }
  const maxCount = Math.max(...counts);
  let distHtml = '<div style="font-size:11px;color:var(--muted);margin-bottom:6px">📊 価格帯分布（全件）</div>';
  for (let i = 0; i < buckets; i++) {
    const from = Math.round(distMin + step * i);
    const pct = maxCount ? (counts[i] / maxCount) * 100 : 0;
    distHtml += `<div class="bar-row">
      <div class="bar-label">${fmt(from)}〜</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-value">${counts[i]}件</div>
    </div>`;
  }
  $('distBars').innerHTML = distHtml;
  $('summaryPanel').classList.remove('hidden');
}

function renderResults(perMarket) {
  const tabBar = $('tabBar');
  tabBar.innerHTML = `<div class="tab active" data-filter="all">すべて ${state.results.length}</div>`;
  const grouped = {};
  for (const r of state.results) grouped[r.market] = (grouped[r.market] || 0) + 1;
  for (const m in grouped) {
    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.dataset.filter = m;
    tab.textContent = `${marketLabel(m)} ${grouped[m]}`;
    tabBar.appendChild(tab);
  }
  tabBar.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      tabBar.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      filterResults(t.dataset.filter);
    };
  });
  filterResults('all');
  $('resultsPanel').classList.remove('hidden');
}

function filterResults(market) {
  const list = $('resultList');
  list.innerHTML = '';
  const items = market === 'all' ? state.results : state.results.filter(r => r.market === market);
  items.sort((a, b) => (b.price || 0) - (a.price || 0));
  for (const r of items) {
    const card = document.createElement('div');
    card.className = 'result-card';
    const imageHtml = r.image
      ? `<div class="result-image"><img src="${escapeHtml(r.image)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>📷</div>'"></div>`
      : `<div class="result-image"><div class="placeholder">📷</div></div>`;
    const typeBadge = r.sold === true
      ? '<span class="badge badge-sold">💰 実取引</span>'
      : '<span class="badge badge-listing">🏷️ 販売中</span>';
    const bodyHtml = `
      <div class="result-body">
        <div class="result-head">
          <div class="result-title">${escapeHtml(r.title)}</div>
        </div>
        <div class="result-meta">
          <span class="badge badge-${r.market}">${marketLabel(r.market)}</span>
          ${typeBadge}
          ${r.condition ? `<span>${escapeHtml(r.condition)}</span>` : ''}
          ${r.sold_date ? `<span>${escapeHtml(r.sold_date)}</span>` : ''}
        </div>
        <div class="result-price" style="margin-top:auto">¥${(r.price || 0).toLocaleString()}</div>
      </div>`;
    const inner = imageHtml + bodyHtml;
    card.innerHTML = r.url ? `<a href="${r.url}" target="_blank" rel="noopener">${inner}</a>` : inner;
    list.appendChild(card);
  }
}

function marketLabel(m) {
  return {
    yahoo_auction: 'ヤフオク!',
    paypay: 'Yahoo!フリマ',
    mercari: 'メルカリ',
    rakuma: 'ラクマ',
    rakuten: '楽天市場',
    yahoo_shopping: 'Yahoo!ショッピング',
    ebay: 'eBay',
    tiktok: 'TikTok'
  }[m] || m;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
